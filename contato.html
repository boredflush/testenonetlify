<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XP Games - Contato</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="bg"></div>

  <header class="header">
    <div class="logo">🎮 XP Games</div>
    <nav class="menu">
      <a href="index.html" class="nav-btn">Início</a>
      <a href="jogos.html" class="nav-btn">Jogos</a>
      <a href="lancamentos.html" class="nav-btn">Lançamentos</a>
      <a href="promocoes.html" class="nav-btn">Promoções</a>
      <a href="contato.html" class="nav-btn active">Contato</a>
    </nav>
  </header>

  <main class="main-content">
    <section class="section-title">
      <h2>Fale Conosco</h2>
      <p>Envie sua dúvida ou feedback diretamente para nossa central técnica</p>
    </section>
    <div class="contact-container">
      <div class="xp-window">
        <div class="xp-title-bar"><span>Enviar Mensagem ao Suporte Técnico</span></div>
        <div class="xp-window-body">
          <form action="index.html" method="GET">
            <div class="xp-form-group">
              <label>Seu Nome:</label>
              <input type="text" required class="xp-input">
            </div>
            <div class="xp-form-group">
              <label>Seu E-mail:</label>
              <input type="email" required class="xp-input">
            </div>
            <div class="xp-form-group">
              <label>Mensagem:</label>
              <textarea required class="xp-textarea" placeholder="Como podemos ajudar?"></textarea>
            </div>
            <div class="xp-divider"></div>
            <div class="xp-dialog-buttons">
              <button type="submit" class="xp-btn primary">Enviar Dados</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer"><h3>🎮 XP Games Store</h3><p>© 2026 - Todos os direitos reservados</p></footer>
</body>
</html>
