<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>XP Games Store</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- TOPO -->
  <div class="topo">

    <div class="logo">
      🎮 XP Games
    </div>

    <div class="menu">
      <a href="">Início</a>
      <a href="">Jogos</a>
      <a href="">Promoções</a>
      <a href="">Contato</a>
    </div>

  </div>

  <!-- BANNER -->

  <div class="banner">

    <h1>XP Games Store</h1>

    <p>
      A loja gamer inspirada no visual clássico do Windows XP
    </p>

    <button>
      Ver Jogos
    </button>

  </div>

  <!-- PRODUTOS -->

  <h1 class="titulo">
    Jogos em Destaque
  </h1>

  <div class="produtos">

    <!-- CARD 1 -->

    <div class="card">

      <img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=1200&auto=format&fit=crop">

      <div class="conteudo">

        <h2>Cyber Battle</h2>

        <div class="preco">
          R$ 89,90
        </div>

        <button>
          Comprar
        </button>

      </div>

    </div>

    <!-- CARD 2 -->

    <div class="card">

      <img src="https://images.unsplash.com/photo-1493711662062-fa541adb3fc8?q=80&w=1200&auto=format&fit=crop">

      <div class="conteudo">

        <h2>Racing Legends</h2>

        <div class="preco">
          R$ 59,90
        </div>

        <button>
          Comprar
        </button>

      </div>

    </div>

    <!-- CARD 3 -->

    <div class="card">

      <img src="https://images.unsplash.com/photo-1511882150382-421056c89033?q=80&w=1200&auto=format&fit=crop">

      <div class="conteudo">

        <h2>Pixel Warriors</h2>

        <div class="preco">
          R$ 39,90
        </div>

        <button>
          Comprar
        </button>

      </div>

    </div>

  </div>

  <!-- RODAPÉ -->

  <div class="rodape">
    © 2026 XP Games Store - Todos os direitos reservados
  </div>

</body>
</html>
