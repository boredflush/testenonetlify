      const card = document.createElement("div");
      card.classList.add("card");

      // Rota atualizada e oficial da CDN da Steam
      const imageUrl = `https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/${steamId}/header.jpg`;
      const fallbackUrl = fallbackImages[index % fallbackImages.length];

      const isFree = freeToPlayIds.includes(steamId);
      const priceText = isFree ? "Gratuito" : `R$ ${(59 + (index * 7) % 160)},90`;

      // O truque está no 'onerror': se a imagem falhar, ele troca instantaneamente pelo fallback estável
      card.innerHTML = `
        <div class="card-image">
          <img src="${imageUrl}" alt="${gameName}" loading="lazy" onerror="this.onerror=null; this.src='${fallbackUrl}';">
        </div>

        <div class="card-content">
          <span class="tag">${genre}</span>
          <h3>${gameName}</h3>
          <p>

          </p>

            <div class="price">
              ${priceText}
            </div>
            <button>
              ${isFree ? "Jogar" : "Comprar"}
            </button>
          </div>
        </div>
      `;
